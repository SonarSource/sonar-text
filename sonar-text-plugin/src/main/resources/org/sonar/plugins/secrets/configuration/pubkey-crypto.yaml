    - id: pkcs8-rsa-raw-base64
      rspecKey: S6706
      selectivity: providerGeneric
      metadata:
        name: Raw PKCS#8 RSA Private Key (no PEM armor)
      detection:
        pre:
          reject:
            paths:
              ${common/rejectedPaths.yaml}
          include:
            content:
              - "IBADANBgkqhkiG9w0BAQ"  # base64(version=0 + rsaEncryption OID start): invariant in all PKCS#8 RSA keys
        matching:
          pattern: >-
            (MII[A-Za-z0-9+/]{3}IBADANBgkqhkiG9w0BAQ[A-Za-z0-9+/]{100,}[A-Za-z0-9+/=]{0,3})
      examples:
        - text: |
            static String privateKeyString = "";
          containsSecret: true
          match: ""
        # Public key (SubjectPublicKeyInfo) must not match — starts with MIIBIj, not MIIEvgIBAD
        - text: |
            String publicKey = "";
          containsSecret: false

    - id: pkcs1-rsa-raw-base64
      rspecKey: S6706
      selectivity: providerGeneric
      metadata:
        name: Raw PKCS#1 RSA Private Key (no PEM armor)
      detection:
        pre:
          reject:
            paths:
              ${common/rejectedPaths.yaml}
          include:
            content:
              - "IBAAKCAQEA"  # base64(version=0 + modulus length 0x0101 = 257 bytes): 2048-bit RSA
              - "IBAAKCAYEA"  # base64(... + modulus length 0x0181 = 385 bytes): 3072-bit RSA
              - "IBAAKCAgEA"  # base64(... + modulus length 0x0201 = 513 bytes): 4096-bit RSA
        matching:
          pattern: >-
            (MII[A-Za-z0-9+/]{3}IBAAKCA[QYg]EA[A-Za-z0-9+/]{100,}[A-Za-z0-9+/=]{0,3})
      examples:
        - text: |
            private static final String RSA_KEY = "";
          containsSecret: true
          match: ""
        # 3072-bit RSA — modulus length encodes to a different character at the same position ("AYEA" not "AQEA")
        - text: |
            private static final String RSA_KEY_3072 = "";
          containsSecret: true
          match: ""
        # 4096-bit RSA — modulus length encodes to yet another character at the same position ("AgEA" not "AQEA"/"AYEA")
        - text: |
            private static final String RSA_KEY_4096 = "";
          containsSecret: true
          match: ""
        - text: |
            val privateKey = key.replace("MIIEow", "").replace("IBAAKCAQEA", "")
          containsSecret: false
        # Legacy short-key-length variants (512/1024/1536-bit RSA) use a single-byte DER length
        # form entirely ("MIIC...IBAAJB.../IBAAKBgQ.../IBAAKBwQ...") and are not covered by this
        # anchor; those key sizes are deprecated/rarely seen in raw base64 without PEM armor.


