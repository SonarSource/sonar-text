[versions]
sonar-commons = "2.32.0.5319"
# Before updating the plugin-api version, make sure to check the compatibility matrix and stick to the lowest denominator
# https://github.com/SonarSource/sonar-plugin-api?tab=readme-ov-file#compatibility
sonar-plugin-api = "13.4.2.4284"
sonarqube = "26.9.0.129388"
sonar-java = "8.43.0.47668"
sonar-php = "3.59.0.16496"
sonar-scanner-engine = "13.12.0.5977"
sonar-scanner-gradle = "7.5.0.8588"
sonar-scanner-integration-tester = "1.2.0.1354"
sonar-orchestrator = "6.4.3.4676"
sonar-license-api = "3.4"
sonar-lint = "11.10.0.86299"
slf4j = "2.0.19"
logback = "1.6.3"
jackson = "3.2.2"
# Jackson 2 still reaches the CLI test classpath via WireMock and the Orchestrator; pinned because
# WireMock's own jackson-bom 2.20.1 has known jackson-databind CVEs
jackson2 = "2.22.2"
json-schema-validator = "3.0.6"
pico-cli = "4.7.7"
junit = "6.1.3"
assertj = "3.27.7"
mockito = "5.23.0"
yguard = "4.1.1"
eclipse-jgit = "7.8.0.202609011348-r"
commons-io = "2.22.0"
re2j = "1.8"
gradle-shadow = "9.6.1" # should be in sync with build-logic/common/gradle/libs.versions.toml
awaitility = "4.3.0"
ahocorasick = "0.6.3"
tink = "1.23.0"
wiremock = "3.13.2"
ayza = "10.0.7"
bouncycastle = "1.85"
xerces = "2.12.2"

[libraries]
sonar-analyzer-commons = { module = "org.sonarsource.analyzer-commons:sonar-analyzer-commons", version.ref = "sonar-commons" }
sonar-plugin-api = { module = "org.sonarsource.api.plugin:sonar-plugin-api", version.ref = "sonar-plugin-api" }
sonar-plugin-api-test-fixtures = { module = "org.sonarsource.api.plugin:sonar-plugin-api-test-fixtures", version.ref = "sonar-plugin-api" }
sonar-ws = { module = "org.sonarsource.sonarqube:sonar-ws", version.ref = "sonarqube" }
sonar-java-checks = { module = "org.sonarsource.java:java-checks", version.ref = "sonar-java" }
sonar-sensor-test-fixtures = { module = "org.sonarsource.scanner.engine:sensor-test-fixtures", version.ref = "sonar-scanner-engine" }
sonar-plugin-api-scanner-impl = { module = "org.sonarsource.scanner.engine:plugin-api-scanner-impl", version.ref = "sonar-scanner-engine" }
sonar-scanner-gradle = { module = "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin", version.ref = "sonar-scanner-gradle" }
sonar-orchestrator-junit5 = { module = "org.sonarsource.orchestrator:sonar-orchestrator-junit5", version.ref = "sonar-orchestrator" }
sonar-scanner-integration-tester = { module = "com.sonarsource.scanner.integrationtester:sonar-scanner-integration-tester", version.ref = "sonar-scanner-integration-tester" }
sonar-lint-core = { module = "org.sonarsource.sonarlint.core:sonarlint-core", version.ref = "sonar-lint" }
sonar-lint-rpc-java-client = { module = "org.sonarsource.sonarlint.core:sonarlint-rpc-java-client", version.ref = "sonar-lint" }
sonar-lint-rpc-impl = { module = "org.sonarsource.sonarlint.core:sonarlint-rpc-impl", version.ref = "sonar-lint" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-dataformat-smile = { module = "tools.jackson.dataformat:jackson-dataformat-smile", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
com-networknt-jsonSchemaValidator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
picocli = { module = "info.picocli:picocli", version.ref = "pico-cli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "pico-cli" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
# Version of JUnit Platform is taken from the JUnit BOM that is imported by junit-jupiter
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
sonar-license-api = { module = "com.sonarsource.license:license-api", version.ref = "sonar-license-api" }
yguard = { module = "com.yworks:yguard", version.ref = "yguard"}
eclipse-jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "eclipse-jgit" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
google-re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
gradle-shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "gradle-shadow" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility"}
ahocorasick = { module = "org.ahocorasick:ahocorasick", version.ref = "ahocorasick" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
ayza-pem = { module = "io.github.hakky54:ayza-for-pem", version.ref = "ayza" }
bc-pkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
xerces = { module = "xerces:xercesImpl", version.ref = "xerces" }

[plugins]
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "6.0.10" }
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "0.11.5" }
